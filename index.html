<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My GitHub Portfolio</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1 id="username">My GitHub Portfolio</h1>
    <p>Auto-fetched repositories, sorted by category</p>
  </header>

  <nav>
    <button class="tab-button" data-tab="all">All</button>
    <button class="tab-button" data-tab="research">Research</button>
    <button class="tab-button" data-tab="scripts">Scripts</button>
    <button class="tab-button" data-tab="archived">Archived</button>
  </nav>

  <main id="repo-list"></main>

  <footer>
    <p>Made using GitHub Pages</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
